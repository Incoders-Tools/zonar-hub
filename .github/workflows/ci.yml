name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  # One group per PR so a new commit cancels the stale run; every dev/main push is tested.
  group: >-
    ci-${{ github.workflow }}-${{ github.event_name == 'pull_request'
    && format('pr-{0}', github.event.pull_request.number)
    || format('push-{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # package.json requires node >= 20.11.1 and npm >= 10.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (ChromeHeadless)
        run: npm run test:ci

      # ZH_API_BASE_URL is intentionally unset: CI only proves the build; deployments set it.
      - name: Production build
        run: npm run build
