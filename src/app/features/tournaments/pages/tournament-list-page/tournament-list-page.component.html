<section class="tournament-list">
  <header class="tournament-list__header">
    <h1>{{ 'tournaments.title' | t }}</h1>
    <p>{{ 'publicTournaments.list.subtitle' | t }}</p>
  </header>

  @if (loading()) {
    <app-loading-state messageKey="publicTournaments.list.loading"></app-loading-state>
  } @else if (error(); as errorKey) {
    <app-error-state title="publicTournaments.list.errorTitle" [message]="errorKey" (retried)="load()"></app-error-state>
  } @else if (tournaments().length === 0) {
    <app-empty-state message="publicTournaments.list.empty"></app-empty-state>
  } @else {
    <ul class="tournament-list__grid">
      @for (tournament of tournaments(); track tournament.slug) {
        <li>
          <app-public-tournament-card [tournament]="tournament"></app-public-tournament-card>
        </li>
      }
    </ul>
  }
</section>
