<div class="public-draw">
  <header class="public-draw__header">
    @if (detailPath(); as path) {
      <a [routerLink]="path" class="public-draw__back">
        <mat-icon aria-hidden="true">arrow_back</mat-icon>
        {{ 'tournaments.backToDetail' | t }}
      </a>
    }
    <h1>{{ 'draw.title' | t }}</h1>
    @if (tournament(); as t) {
      <p class="public-draw__subtitle">{{ t.name }}</p>
    }
  </header>

  <app-public-draw-panel>
    <div class="public-draw__empty" role="status">
      <mat-icon class="public-draw__empty-icon" aria-hidden="true">account_tree</mat-icon>
      <p>{{ 'draw.notPublished' | t }}</p>
    </div>
  </app-public-draw-panel>
</div>
