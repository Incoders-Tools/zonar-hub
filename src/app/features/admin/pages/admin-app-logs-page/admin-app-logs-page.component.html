<div class="logs-page">
  <!-- Page Header -->
  <div class="logs-page__header">
    <div class="logs-page__title-row">
      <div>
        <h1 class="logs-page__title">{{ 'admin.appLogs.title' | t }}</h1>
        <p class="logs-page__subtitle">{{ 'admin.appLogs.subtitle' | t }}</p>
      </div>
      <div class="logs-page__header-actions">
        <app-help-button [titleKey]="'admin.appLogs.help.title'" [sections]="helpSections"></app-help-button>
        @if (hasSelection()) {
          <app-async-button
            variant="danger"
            [loading]="facade.updating()"
            (clicked)="openBulkDelete()">
            {{ 'admin.appLogs.action.bulkDelete' | t }}
          </app-async-button>
        }
      </div>
    </div>
  </div>

  <!-- Filter Panel -->
  <app-filter-panel
    [fields]="filterFields"
    [collapsible]="true"
    [defaultCollapsed]="false"
    (filtersApplied)="onFiltersApplied($event)"
    (filtersCleared)="onFiltersCleared()">
  </app-filter-panel>

  <!-- Cleanup Panel -->
  <div class="logs-page__cleanup">
    <label>{{ 'admin.appLogs.cleanup.label' | t }}:</label>
    <div class="logs-page__cleanup-inputs">
      <input
        type="number"
        min="1"
        max="3650"
        [(ngModel)]="retentionDays"
        class="logs-page__cleanup-input"
        [disabled]="facade.cleaning()">
      <app-async-button
        [loading]="facade.cleaning()"
        (clicked)="runCleanup()">
        {{ 'admin.appLogs.cleanup.action' | t }}
      </app-async-button>
    </div>
  </div>

  <!-- Data Table -->
  <app-data-table
    [columns]="columns"
    [data]="tableData()"
    [loading]="facade.loading()"
    [error]="!!facade.error()"
    [selectable]="true"
    [rowActions]="rowActions"
    [paginated]="true"
    [pageSize]="10"
    paginationPosition="both"
    emptyMessageKey="common.noResults"
    (selectionChanged)="onSelectionChanged($event)"
    (sorted)="onSorted($event)"
    (rowAction)="onRowActionClicked($event)">
  </app-data-table>
</div>

<!-- Delete Confirmation Dialog -->
@if (showDeleteDialog()) {
  <app-confirm-dialog
    titleKey="admin.appLogs.confirm.deleteTitle"
    messageKey="admin.appLogs.confirm.deleteMessage"
    confirmLabelKey="common.delete"
    confirmVariant="danger"
    [loading]="facade.updating()"
    (confirmed)="executeDelete()"
    (cancelled)="cancelDelete()">
  </app-confirm-dialog>
}

<!-- Bulk Delete Confirmation Dialog -->
@if (showBulkDeleteDialog()) {
  <app-confirm-dialog
    titleKey="admin.appLogs.confirm.bulkDeleteTitle"
    messageKey="admin.appLogs.confirm.bulkDeleteMessage"
    confirmLabelKey="common.delete"
    confirmVariant="danger"
    [loading]="facade.updating()"
    (confirmed)="executeBulkDelete()"
    (cancelled)="cancelBulkDelete()">
  </app-confirm-dialog>
}
