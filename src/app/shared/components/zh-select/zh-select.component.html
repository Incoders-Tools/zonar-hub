<div class="zh-select" [class.zh-select--invalid]="hasError()" [class.zh-select--disabled]="isDisabled()">
  @if (label()) {
    <label class="zh-select__label" [attr.for]="autoId()">
      {{ label() }}
      @if (required()) {
        <span class="zh-select__required-marker" aria-hidden="true">*</span>
      }
    </label>
  }

  <div class="zh-select__control">
    <select
      class="zh-select__input"
      [id]="autoId()"
      [value]="value()"
      [disabled]="isDisabled()"
      [attr.aria-invalid]="hasError() ? 'true' : null"
      [attr.aria-required]="required() ? 'true' : null"
      (change)="handleChange($event)">
      @if (placeholder()) {
        <option value="">{{ placeholder() }}</option>
      }
      @for (option of options(); track option.value) {
        <option [value]="option.value" [disabled]="option.disabled ?? false">
          {{ option.label }}
        </option>
      }
    </select>
  </div>

  @if (selectedDescription()) {
    <span class="zh-select__description">{{ selectedDescription() }}</span>
  }

  @if (hasError() && errorMessage()) {
    <span class="zh-select__error" role="alert">{{ errorMessage() }}</span>
  } @else if (hint()) {
    <span class="zh-select__hint">{{ hint() }}</span>
  }
</div>
