@if (visible()) {
  <div class="cookie-banner" role="alert" aria-live="polite">
    <div class="cookie-banner__inner">
      <p class="cookie-banner__message">{{ 'cookie.message' | t }}</p>
      <div class="cookie-banner__actions">
        <button class="cookie-banner__accept" (click)="accept()">{{ 'cookie.accept' | t }}</button>
        <button class="cookie-banner__dismiss" (click)="dismiss()" [attr.aria-label]="'common.close' | t">&times;</button>
      </div>
    </div>
  </div>
}
